spring.application.name=backend-turnoApp
spring.profiles.default=dev

# JPA / Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# HTTP / JSON
server.port=8080
server.error.include-message=never
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.default-property-inclusion=non_null

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Seguridad
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-please-1234567890}
app.jwt.access-minutes=15
app.jwt.refresh-days=7
app.cors.allowed-origins=http://localhost:5173

# OTP
app.otp.expiration-minutes=10
app.otp.max-sends=3
app.otp.send-window-minutes=15
app.otp.max-attempts=5
app.otp.log-codigo=false

# Turnos
app.turnos.dias-maximos=90
app.turnos.anticipacion-minima-horas=2
app.turnos.cancelacion-minima-horas=24

# Clínica
app.clinica.nombre=Clínica Sagrada Familia
app.clinica.direccion=Gral. Paz y Libertad 3
app.clinica.zona-horaria=America/Argentina/Buenos_Aires

# Administrador inicial (sin password no se crea)
app.admin.email=${APP_ADMIN_EMAIL:nicodepor3.1@gmail.com}
app.admin.password=${APP_ADMIN_PASSWORD:}

# Datos de demostración
app.demo.enabled=false
app.demo.password=${APP_DEMO_PASSWORD:demo1234}

# Notificaciones
app.notificaciones.remitente=${APP_MAIL_FROM:no-responder@sagradafamilia.local}
