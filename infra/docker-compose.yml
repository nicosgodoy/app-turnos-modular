services:
  postgres:
    image: postgres:17-alpine
    container_name: turnos-postgres
    environment:
      POSTGRES_DB: turnos
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: turnos
    ports:
      - "5433:5432"
    volumes:
      - turnos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnos"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: turnos-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  turnos_pgdata:
